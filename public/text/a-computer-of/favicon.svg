<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .ink { fill: none; stroke: #0a0a0a; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .screen { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f5f5f5; }
      .screen { fill: #0a0a0a; }
    }
  </style>
  <!-- monitor -->
  <rect class="ink screen" x="4" y="4" width="24" height="17" rx="4"/>
  <!-- a blank on the screen, like the ___ in the title -->
  <path class="ink" d="M9.5 15.5h7"/>
  <!-- stand -->
  <path class="ink" d="M16 21v4M10 27.5h12"/>
</svg>
