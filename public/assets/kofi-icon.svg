  />

  <!-- heart, filled black, smaller and centered within the cup -->
  <path
    d="M212 320
       C 172 286 128 252 128 202
       C 128 172 150 150 178 150
       C 196 150 210 159 212 178
       C 214 159 228 150 246 150
       C 274 150 296 172 296 202
       C 296 252 252 286 212 320 Z"
